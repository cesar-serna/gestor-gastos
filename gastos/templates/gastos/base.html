<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Gastos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body style="font-family: sans-serif; margin: 20px;">

    <nav style="background-color: #e3e3e3; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <strong>Gestor de Gastos</strong>
        <a href="{% url 'gasto_list' %}" class="btn btn-primary">Mis Gastos</a> 
        <a href="{% url 'gasto_create' %}" class="btn btn-primary">Añadir Gasto</a>
        
        <form action="{% url 'logout' %}" method="post" style="display:inline; float: right;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Cerrar Sesión ({{ user.username }})</button>
        </form>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
